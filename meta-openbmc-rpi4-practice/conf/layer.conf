# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-openbmc-rpi4-practice"
BBFILE_PATTERN_meta-openbmc-rpi4-practice = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-openbmc-rpi4-practice = "6"

LAYERDEPENDS_meta-openbmc-rpi4-practice = "core"
LAYERSERIES_COMPAT_meta-openbmc-rpi4-practice = "blacksail wrynose"
