MACHINE = "raspberrypi4-64"
DISTRO ?= "openbmc-phosphor"
PACKAGE_CLASSES ?= "package_ipk"
SANITY_TESTED_DISTROS:append ?= " *"
EXTRA_IMAGE_FEATURES ?= "allow-root-login"
# Include opkg and retain the package database in the firmware.
EXTRA_IMAGE_FEATURES:append = " package-management"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
CONF_VERSION = "2"

# Set the root password to '0penBmc'
# Defaults from meta-phosphor/conf/distro/include/phosphor-defaults.inc

require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/obmc-evb-common.inc

# Limit concurrent BitBake tasks.
BB_NUMBER_THREADS = "6"

# Limit parallel Make jobs per task.
PARALLEL_MAKE = "-j 6"

# Limit parallel Make jobs during installation.
PARALLEL_MAKEINST = "-j 6"

# Limit recipe parsing threads.
BB_NUMBER_PARSE_THREADS = "6"

# 64-bit Raspberry Pi kernel
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image"

# Partitioned SD-card image instead of OpenBMC flash images
IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Boot directly into the SD-card root filesystem
INITRAMFS_IMAGE = ""

# Enable GPIO serial console for debugging
ENABLE_UART = "1"

IMAGE_INSTALL:append = " temperature-reader chassis-inventory curl iproute2-ss"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
